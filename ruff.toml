# Stdlib-only scripts that must run on Python 3.8.
line-length = 135
target-version = "py38"

[lint]
select = ["E", "F", "W", "B", "SIM", "PIE", "C4", "RUF"]
ignore = [
  "B905",    # zip(strict=) needs Python 3.10
  "SIM105",  # try/except/pass reads clearer than contextlib.suppress here
  "SIM108",  # ternaries are not always clearer
  "SIM905",  # word lists read better as one split string
  "RUF005",  # list concatenation is clearer for short literals
  "RUF001", "RUF002", "RUF003",  # non-ASCII text in tests and benchmark data is intended
]

[lint.per-file-ignores]
"tests/*" = ["SIM115", "RUF012"]
"bench/*" = ["SIM115"]
